spring.application.name=cs2

# Los tests usan una base H2 en memoria, aparte de la base de desarrollo.
spring.datasource.url=jdbc:h2:mem:cs2test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
cs2.datos-iniciales=false

# Los tests no salen a internet: el cliente se prueba con respuestas simuladas.
cs2.objetos-api.url=http://localhost:9
cs2.objetos-api.timeout-ms=1000

# POO-09: los compañeros se simulan en los tests (no se sale a la red)
cs2.a2.url=http://localhost:9
cs2.a3.url=http://localhost:9
cs2.companeros.timeout-ms=1000
