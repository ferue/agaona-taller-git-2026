spring.application.name=cs2

# Los tests usan una base H2 en memoria, aparte de la base de desarrollo.
spring.datasource.url=jdbc:h2:mem:cs2test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
cs2.datos-iniciales=false
