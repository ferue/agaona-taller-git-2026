spring.application.name=cs2

# --- Base de datos H2 en archivo (los datos sobreviven a los reinicios) ---
# El archivo queda en cs2/data/cs2db.mv.db (ignorado por Git).
spring.datasource.url=jdbc:h2:file:./data/cs2db
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# update: crea las tablas si no existen y conserva los datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Consola web de H2: http://localhost:8080/h2-console ---
# JDBC URL: jdbc:h2:file:./data/cs2db   Usuario: sa   Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga armas de ejemplo si la tabla está vacía
cs2.datos-iniciales=true
