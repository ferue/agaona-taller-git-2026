spring.application.name=cs2

# --- Puerto: 8080 por defecto; se cambia sin tocar código con la variable
# de entorno PORT o con --server.port=8082 (por ejemplo, si el grupo corre
# los tres servicios en la misma máquina) ---
server.port=${PORT:8080}

# --- Base de datos H2 en archivo (los datos sobreviven a los reinicios) ---
# El archivo queda en cs2/data/cs2db.mv.db (ignorado por Git).
spring.datasource.url=jdbc:h2:file:./data/cs2db
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# update: crea las tablas si no existen y conserva los datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Consola web de H2: http://localhost:8080/h2-console ---
# JDBC URL: jdbc:h2:file:./data/cs2db   Usuario: sa   Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga armas de ejemplo si la tabla está vacía
cs2.datos-iniciales=true

# --- API externa consumida con WebClient (https://restful-api.dev) ---
# URL base y tiempo máximo de espera de cada pedido.
cs2.objetos-api.url=https://api.restful-api.dev
cs2.objetos-api.timeout-ms=5000

# --- OpenAPI y Swagger UI (springdoc) ---
# Documento OpenAPI en JSON: http://localhost:8080/v3/api-docs
# Página para leer y probar la API: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
# Las respuestas de error se documentan en cada endpoint, no se agregan las de todos los handlers.
springdoc.override-with-generic-response=false
# Link público que se anuncia en el OpenAPI, además de "/" (ver OpenApiConfig)
cs2.openapi.url-publica=https://ariel.tail26e794.ts.net

# --- POO-09: APIs de los compañeros (A2 y A3) ---
# Se pueden cambiar sin tocar código con variables de entorno: CS2_A2_URL, CS2_A3_URL, CS2_A3_ARMA_ID...
cs2.companeros.timeout-ms=5000
# A2: Mauricio Pecci. OpenAPI: https://desktop-hrm8vjo.tailde75e4.ts.net/v3/api-docs
cs2.a2.nombre=Mauricio Pecci
cs2.a2.url=https://desktop-hrm8vjo.tailde75e4.ts.net
# Arma que dispara y su objetivo (su base es en memoria: hay que crearlas al arrancar su servicio)
cs2.a2.arma-id=1
cs2.a2.objetivo-id=2
# A3: Vanessa Ricciardi. OpenAPI: http://100.95.213.93:8081/v3/api-docs (red de Tailscale)
cs2.a3.nombre=Vanessa Ricciardi
cs2.a3.url=http://100.95.213.93:8081
# id 4 = "AK-47 lleno" (acepta); id 3 = "AK-47 vacio" (rechaza con 409)
cs2.a3.arma-id=4
cs2.a3.distancia=10

# Log DEBUG de cada paso de la integración con los compañeros
logging.level.py.edu.uc.lp3.ag.cs2.client=DEBUG
logging.level.py.edu.uc.lp3.ag.cs2.service.JugadaService=DEBUG
